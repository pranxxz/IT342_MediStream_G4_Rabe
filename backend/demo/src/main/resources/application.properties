spring.application.name=medistream-backend

# ====================================
# Load environment variables from .env file
# ====================================
# DEBUG - Check if file is being loaded
debug=true
logging.level.org.springframework.boot.context.config=DEBUG

# Try loading with explicit path
spring.config.import=optional:file:.env[.properties]
# ====================================
# PostgreSQL Database Configuration (Supabase)
# ====================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================
# JPA / Hibernate Settings
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10

# ====================================
# Server Configuration
# ====================================
server.port=8080

# ====================================
# CORS for React Frontend
# ====================================
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ====================================
# Logging
# ====================================
logging.level.org.springframework.web=INFO
logging.level.medistream=DEBUG

# ====================================
# JWT Configuration
# ====================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ====================================
# Google OAuth2 Settings
# ====================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${FRONTEND_URL}/oauth2/callback

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub